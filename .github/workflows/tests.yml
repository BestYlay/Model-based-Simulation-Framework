name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic smoke demo
        run: python -m examples.quickstart --epochs 1 --device cpu
