[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-simulation"
version = "0.1.0"
description = "Transformer-based survival modeling and counterfactual disease progression simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "BestYlay" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
analysis = [
  "jupyter>=1.0",
  "lifelines>=0.28",
  "matplotlib>=3.8",
  "optuna>=3.6",
  "scikit-survival>=0.22",
  "seaborn>=0.13",
  "shap>=0.44",
  "tqdm>=4.66",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["survival_simulation*"]
